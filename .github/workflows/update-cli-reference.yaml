name: Update CLI reference

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-cli-reference
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'grafana/gcx'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
          path: automation

      - name: Select latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable version tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
          path: release-source

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: release-source/go.mod
          cache-dependency-path: release-source/go.sum

      - name: Generate release reference
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash automation/scripts/generate-cli-reference.sh release-source "$RELEASE_TAG" automation/docs/sources/cli-reference.md
          echo "sha=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Create or update rolling PR
        if: steps.generate.outputs.latest == steps.release.outputs.tag
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: automation
          add-paths: docs/sources/cli-reference.md
          base: main
          branch: docs/update-cli-reference
          sign-commits: true
          commit-message: 'docs: update CLI reference for ${{ steps.release.outputs.tag }}'
          title: 'docs: update CLI reference for ${{ steps.release.outputs.tag }}'
          body: |
            Update the CLI, environment-variable, and configuration reference for [${{ steps.release.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}).

            Generated from commit [${{ steps.generate.outputs.sha }}](https://github.com/${{ github.repository }}/commit/${{ steps.generate.outputs.sha }}). This rolling PR is updated when another stable release ships.

            Click **Approve workflows to run** to start CI and the Grafana documentation preview, then review and merge manually.
