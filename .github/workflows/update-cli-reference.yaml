name: Update CLI reference

on: # zizmor: ignore[dangerous-triggers] Only successful same-repo releases; automation comes from main and source from the verified stable tag.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-cli-reference
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'grafana/gcx' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: automation

      - name: Select latest stable release
        id: release
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable version tag: $tag" >&2
            exit 1
          fi
          sha=$(git rev-parse "refs/tags/$tag^{commit}")
          if [[ "$EVENT_NAME" == workflow_run && ( "$sha" != "$RELEASE_COMMIT" || "$tag" != "$RELEASE_TAG" ) ]]; then
            echo "Skipping release run: it is not the latest stable release"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.release.outputs.sha != ''
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
          path: release-source

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.release.outputs.sha != ''
        with:
          go-version-file: release-source/go.mod
          cache-dependency-path: release-source/go.sum

      - name: Generate release reference
        if: steps.release.outputs.sha != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash automation/scripts/generate-cli-reference.sh release-source "$RELEASE_TAG" "$RUNNER_TEMP/cli-reference.md"

      - name: Create or update rolling PR
        if: steps.release.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: bash automation/scripts/publish-cli-reference.sh "$RELEASE_TAG" "$RELEASE_SHA" "$RUNNER_TEMP/cli-reference.md"
